services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: agent_runtime
      POSTGRES_USER: agent_runtime
      POSTGRES_PASSWORD: agent_runtime
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent_runtime"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Separate Postgres instance for Temporal server's own internal schema, decoupling
  # its schema/version lifecycle from the application database above.
  temporal-postgresql:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    ports:
      - "5433:5432"
    volumes:
      - temporal-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup:1.29.1
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      POSTGRES_SEEDS: temporal-postgresql
    ports:
      - "7233:7233"
    depends_on:
      temporal-postgresql:
        condition: service_healthy

  # One-shot: registers the custom TenantId/AgentKey search attributes used by
  # AgentRunService when starting workflows. Safe to re-run (fails soft if attributes
  # already exist).
  temporal-setup-search-attributes:
    image: temporalio/admin-tools:1.29.1-tctl-1.18.4-cli-1.5.0
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CLI_ADDRESS: temporal:7233
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        until temporal operator cluster health --address temporal:7233 2>/dev/null | grep -q SERVING; do sleep 1; done
        temporal operator search-attribute create --address temporal:7233 --namespace default --name TenantId --type Keyword || true
        temporal operator search-attribute create --address temporal:7233 --namespace default --name AgentKey --type Keyword || true

  temporal-ui:
    image: temporalio/ui:2.34.0
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: "http://localhost:3000"
    ports:
      # 8088 (not 8080) to avoid clashing with agent-runtime-api
      - "8088:8080"
    depends_on:
      - temporal

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional local-LLM profile: `docker compose --profile local-llm up -d ollama`
  ollama:
    image: ollama/ollama
    profiles: ["local-llm"]
    ports:
      - "11434:11434"
    volumes:
      - ollamadata:/root/.ollama

volumes:
  pgdata:
  temporal-pgdata:
  redisdata:
  ollamadata:
